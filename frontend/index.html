<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Weaver</title>

    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="welcome.css">
    <link rel="stylesheet" href="messages.css">
    <link rel="stylesheet" href="composer.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="icon" type="image/png" href="docs/pics/favicon.png">


</head>

<body>

    <div class="app">

        <video autoplay muted loop playsinline poster="fallback-image.jpg" class="video-background">
            <source src="docs/gifs/barkeep.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <button class="account-button" id="accountButton" type="button">
            Sign in / Sign up
        </button>

        <main class="chat-container" id="chatContainer">

            <!-- Welcome -->
            <section class="welcome">
                <h1>Welcome, Adventurer</h1>
                <p>
                    Jeeves here, I'm here to help you build a D&D character.
                    <br>
                    How much D&amp;D character-building experience do you have?</p>
                <div class="experience-options" id="experienceOptions">
                    <button type="button" data-level="new">New to D&amp;D</button>
                    <button type="button" data-level="some">Some experience</button>
                    <button type="button" data-level="experienced">Experienced</button>
                    <button type="button" data-level="free">Chat freely</button>
                </div>
            </section>

            <!-- Chat messages -->
            <section class="messages" id="messages">
            </section>

            <!-- Message input -->
            <div class="input-container">

                <textarea id="messageInput" placeholder="Type your message..." rows="1"></textarea>

                <button class="send-button" id="sendButton" aria-label="Send message">
                    ↑
                </button>

            </div>

        </main>

    </div>

    <dialog class="auth-dialog" id="authDialog" aria-labelledby="authTitle">
        <div class="auth-header">
            <div>
                <p class="auth-eyebrow">Origin Weaver</p>
                <h2 id="authTitle">Welcome back</h2>
            </div>
            <button class="auth-close" id="closeAuthButton" type="button" aria-label="Close sign in dialog">
                &times;
            </button>
        </div>

        <div class="auth-mode" role="group" aria-label="Choose sign in or sign up">
            <button type="button" data-auth-mode="signin" aria-pressed="true">Sign in</button>
            <button type="button" data-auth-mode="signup" aria-pressed="false">Sign up</button>
        </div>

        <form class="auth-form" id="authForm">
            <label>
                Email
                <input id="authEmail" name="email" type="email" autocomplete="email" required>
            </label>
            <label>
                Password
                <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="8" required>
            </label>
            <label id="authConfirmField" hidden>
                Confirm password
                <input id="authConfirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8">
            </label>
            <button class="auth-submit" id="authSubmit" type="submit">Sign in</button>
            <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
        </form>
    </dialog>

    <script src="chat.js"></script>
    <script src="auth.js"></script>

</body>

</html>
